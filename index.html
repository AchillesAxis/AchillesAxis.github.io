        * {

            text-decoration: none;

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #b84c46;
        }

        .nav-links .actief {

            padding-bottom: 4px;
        }

        .btn-contact {
            background-color: #111111;

            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 500;
            transition: background 0.3s !important;
        }

        .btn-contact:hover {
            background-color: #333333 !important;
        }

        /* Gesplitste Hero Sectie */
        .hero {
            display: flex;
            min-height: calc(100vh - 85px);
            width: 100%;
        }

        /* Linkerkant: Afbeelding */
        .hero-image-container {
            flex: 1;
            background-color: #e2dfd8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tijdelijke tekst als er nog geen afbeelding is geladen */
        .placeholder-tekst {
            color: #777;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
